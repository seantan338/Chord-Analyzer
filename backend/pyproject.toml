[project]
name = "chord-analyzer-backend"
version = "0.1.0"
description = "Chord Analyzer API: audio upload -> key, tempo, chords, structure."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = [
  "N803", # numeric/DSP code conventionally uses capitalised matrix names (S, C, R)
  "N806",
  "RUF001", # musical symbols (♯ ♭) are intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["librosa.*", "scipy.*", "soundfile.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: runs the full DSP pipeline on synthesized audio",
]
